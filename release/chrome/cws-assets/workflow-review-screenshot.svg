<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-labelledby="title desc">
  <title id="title">Record workflow review</title>
  <desc id="desc">A clean Record workflow review screen showing captured steps ready for review.</desc>
  <rect width="1280" height="800" fill="#f7f7fb"/>
  <rect x="0" y="0" width="1280" height="72" fill="#ffffff"/>
  <rect x="0" y="71" width="1280" height="1" fill="#e6e6ef"/>
  <rect x="48" y="17" width="38" height="38" rx="11" fill="#6c35f5"/>
  <path d="M58 28c3-5 8-5 11 0l5 9 5-9c3-5 8-5 11 0l-10 20c-2 4-7 4-9 0l-4-8-4 8c-2 4-7 4-9 0z" fill="#fff" transform="translate(-2 0) scale(.72)"/>
  <text x="104" y="46" fill="#242331" font-family="HelveticaNeue" font-size="24" font-weight="bold">Record</text>
  <text x="1090" y="43" fill="#77758a" font-family="DejaVu Sans" font-size="14">Workflow review</text>
  <text x="72" y="142" fill="#242331" font-family="HelveticaNeue" font-size="32" font-weight="bold">Review your captured workflow</text>
  <text x="72" y="176" fill="#77758a" font-family="DejaVu Sans" font-size="17">Check each step before you install it as an automation.</text>
  <rect x="72" y="220" width="748" height="470" rx="18" fill="#ffffff" stroke="#e5e4ed"/>
  <text x="108" y="266" fill="#242331" font-family="HelveticaNeue" font-size="19" font-weight="bold">Daily vendor status brief</text>
  <rect x="108" y="292" width="676" height="1" fill="#ecebf2"/>
  <circle cx="132" cy="342" r="9" fill="#6c35f5"/>
  <text x="160" y="349" fill="#242331" font-family="HelveticaNeue" font-size="16" font-weight="bold">Open the vendor dashboard</text>
  <text x="160" y="375" fill="#77758a" font-family="DejaVu Sans" font-size="14">Navigate to the active workspace and verify the current status.</text>
  <rect x="132" y="389" width="1" height="54" fill="#d8d5e8"/>
  <circle cx="132" cy="464" r="9" fill="#6c35f5"/>
  <text x="160" y="471" fill="#242331" font-family="HelveticaNeue" font-size="16" font-weight="bold">Collect the latest updates</text>
  <text x="160" y="497" fill="#77758a" font-family="DejaVu Sans" font-size="14">Capture the visible results and flag missing information.</text>
  <rect x="132" y="511" width="1" height="54" fill="#d8d5e8"/>
  <circle cx="132" cy="586" r="9" fill="#6c35f5"/>
  <text x="160" y="593" fill="#242331" font-family="HelveticaNeue" font-size="16" font-weight="bold">Prepare the review</text>
  <text x="160" y="619" fill="#77758a" font-family="DejaVu Sans" font-size="14">Keep the workflow ready for a final human check.</text>
  <rect x="866" y="220" width="342" height="470" rx="18" fill="#ffffff" stroke="#e5e4ed"/>
  <text x="902" y="266" fill="#242331" font-family="HelveticaNeue" font-size="19" font-weight="bold">Ready to install</text>
  <rect x="902" y="292" width="270" height="52" rx="12" fill="#f1edff"/>
  <circle cx="930" cy="318" r="9" fill="#6c35f5"/>
  <text x="952" y="324" fill="#4b25ba" font-family="HelveticaNeue" font-size="15" font-weight="bold">3 steps captured</text>
  <text x="902" y="386" fill="#77758a" font-family="DejaVu Sans" font-size="14">Review scope</text>
  <text x="902" y="416" fill="#242331" font-family="DejaVu Sans" font-size="16">Active Chrome tab only</text>
  <text x="902" y="466" fill="#77758a" font-family="DejaVu Sans" font-size="14">Privacy guardrails</text>
  <text x="902" y="496" fill="#242331" font-family="DejaVu Sans" font-size="16">Password fields redacted</text>
  <rect x="902" y="570" width="270" height="52" rx="12" fill="#6c35f5"/>
  <text x="980" y="603" fill="#ffffff" font-family="HelveticaNeue" font-size="16" font-weight="bold">Install workflow</text>
</svg>
