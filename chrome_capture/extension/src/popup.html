<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Record Chrome Provider</title>
  <style>
    body {
      width: 300px;
      margin: 0;
      padding: 14px;
      font: 13px/1.4 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #1d1f23;
      background: #f7f8fa;
    }
    h1 {
      margin: 0 0 10px;
      font-size: 15px;
      font-weight: 650;
    }
    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }
    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #8b949e;
    }
    .dot.live {
      background: #1f8f4d;
    }
    button {
      width: 100%;
      border: 0;
      border-radius: 6px;
      padding: 9px 10px;
      margin-top: 8px;
      background: #24292f;
      color: white;
      font-weight: 600;
      cursor: pointer;
    }
    button.secondary {
      background: #e7ebef;
      color: #1d1f23;
    }
    button:disabled {
      opacity: 0.55;
      cursor: default;
    }
    .hint {
      margin-top: 10px;
      color: #5d646d;
      min-height: 18px;
      word-break: break-word;
    }
    .disclosure {
      margin: 0 0 10px;
      padding: 9px 10px;
      border: 1px solid #d0d7de;
      border-radius: 6px;
      color: #3d444d;
      background: #ffffff;
      font-size: 12px;
    }
    .error {
      color: #b42318;
    }
  </style>
</head>
<body>
  <h1>Record Chrome Provider</h1>
  <div class="status">
    <span id="dot" class="dot"></span>
    <span id="state">Checking</span>
  </div>
  <p class="disclosure">During a recording, Hermes captures Chrome URLs, page interactions, non-password typed or pasted text, file metadata, and visible-tab screenshots into the local Hermes profile. Password-field values are redacted.</p>
  <button id="shot" disabled>Capture active-tab screenshot</button>
  <div id="hint" class="hint"></div>
  <script src="popup.js"></script>
</body>
</html>
